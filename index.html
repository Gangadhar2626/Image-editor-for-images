<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="A simple mobile image editor." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <title>Canvas Studio</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MOBILE IMAGE EDITOR</p>
          <h1>Canvas Studio</h1>
        </div>
        <button class="icon-button" id="resetButton" type="button" aria-label="Reset edits">↺</button>
      </header>

      <section class="canvas-card" aria-label="Image preview">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">✦</div>
          <h2>Start with a photo</h2>
          <p>Upload an image to crop, adjust, and save it from your phone.</p>
          <label class="primary-button upload-button">
            Choose image
            <input id="imageInput" type="file" accept="image/*" />
          </label>
        </div>
        <canvas id="canvas" hidden></canvas>
      </section>

      <section class="toolbar" aria-label="Editor controls">
        <div class="tool-row">
          <button class="tool-button active" data-panel="adjustments" type="button"><span>◒</span>Adjust</button>
          <button class="tool-button" data-panel="filters" type="button"><span>◌</span>Filters</button>
          <button class="tool-button" data-panel="ai" type="button"><span>✦</span>AI edit</button>
        </div>

        <div class="control-panel" id="adjustments">
          <label class="range-control">Brightness <output id="brightnessValue">100%</output>
            <input id="brightness" type="range" min="0" max="200" value="100" />
          </label>
          <label class="range-control">Contrast <output id="contrastValue">100%</output>
            <input id="contrast" type="range" min="0" max="200" value="100" />
          </label>
          <label class="range-control">Saturation <output id="saturationValue">100%</output>
            <input id="saturation" type="range" min="0" max="200" value="100" />
          </label>
        </div>

        <div class="control-panel hidden" id="filters">
          <div class="filter-grid">
            <button type="button" data-filter="none">Original</button>
            <button type="button" data-filter="grayscale(1)">Mono</button>
            <button type="button" data-filter="sepia(0.75)">Warm</button>
            <button type="button" data-filter="contrast(1.25) saturate(1.3)">Pop</button>
            <button type="button" data-filter="brightness(1.12) saturate(0.7)">Fade</button>
            <button type="button" data-filter="hue-rotate(25deg) saturate(1.2)">Vivid</button>
          </div>
        </div>

        <div class="control-panel hidden" id="ai">
          <p class="panel-help">Describe a change and send it to the connected image model.</p>
          <textarea id="prompt" rows="2" placeholder="Example: make the sky golden at sunset"></textarea>
          <button class="primary-button full-width" id="aiButton" type="button">Apply AI edit</button>
          <p class="status" id="status" role="status"></p>
        </div>
      </section>

      <footer class="action-bar">
        <label class="secondary-button">
          Replace
          <input id="replaceInput" type="file" accept="image/*" />
        </label>
        <button class="primary-button" id="saveButton" type="button" disabled>Save image</button>
      </footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
